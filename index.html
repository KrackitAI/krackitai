<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krackit - Crack Every Interview</title>
    <!-- Tailwind CSS for premium styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen font-sans antialiased">

    <!-- Top Navbar -->
    <nav class="border-b border-neutral-900 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-2 font-black text-xl tracking-tight">
            <span>Krackit</span>
            <span class="text-[#FFE500]">⚡</span>
        </div>
        <div class="text-xs text-neutral-500 font-mono tracking-wider uppercase bg-neutral-900/50 px-2.5 py-1 rounded-md border border-neutral-800">
            v1.0.0
        </div>
    </nav>

    <!-- Main Container Layout -->
    <main class="max-w-4xl mx-auto px-4 pt-12 pb-24 flex flex-col justify-center items-center">

        <!-- ================= SCREEN 1: LANDING SCREEN ================= -->
        <div id="landing-screen" class="text-center max-w-xl mx-auto space-y-6">
            <h1 class="text-5xl md:text-6xl font-black tracking-tight">
                Krackit <span class="text-[#FFE500]">⚡</span>
            </h1>
            <p class="text-neutral-400 text-lg md:text-xl font-medium max-w-md mx-auto">
                Crack every interview with AI coaching
            </p>
            <div class="pt-4">
                <button onclick="showScreen('input-screen')" class="bg-white text-black hover:bg-neutral-200 transition-all duration-200 font-bold px-8 py-3 rounded-xl inline-flex items-center space-x-2 text-base md:text-lg shadow-lg">
                    <span>Start for free</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- ================= SCREEN 2: INPUT FORM SCREEN ================= -->
        <div id="input-screen" class="hidden w-full max-w-2xl mx-auto space-y-8">
            <div class="text-center space-y-2">
                <h2 class="text-3xl md:text-4xl font-black tracking-tight">Crack Every Interview</h2>
                <p class="text-neutral-400 text-sm md:text-base">
                    Paste your job description and resume — get custom interview questions in seconds
                </p>
            </div>

            <div class="space-y-5 bg-neutral-900/30 p-6 md:p-8 rounded-2xl border border-neutral-900 backdrop-blur-sm shadow-xl">
                <div class="space-y-2">
                    <label class="text-xs font-bold tracking-wider text-neutral-400 uppercase">Job Description</label>
                    <textarea id="job-desc-input" rows="5" placeholder="Paste the job description here..." 
                        class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-neutral-200 placeholder-neutral-600 focus:outline-none focus:border-[#FFE500] focus:ring-1 focus:ring-[#FFE500] transition-all resize-none"></textarea>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold tracking-wider text-neutral-400 uppercase">Candidate Resume</label>
                    <textarea id="resume-input" rows="6" placeholder="Paste your resume here..." 
                        class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-neutral-200 placeholder-neutral-600 focus:outline-none focus:border-[#FFE500] focus:ring-1 focus:ring-[#FFE500] transition-all resize-none"></textarea>
                </div>

                <div class="pt-2">
                    <button id="generate-btn" onclick="submitInterviewData()" 
                        class="w-full bg-[#FFE500] hover:bg-[#ebd300] text-black font-black py-4 rounded-xl transition-all duration-200 flex items-center justify-center space-x-2 text-base shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                        <span id="btn-text">Generate My Questions ⚡</span>
                        <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= SCREEN 3: RESULTS DASHBOARD SCREEN ================= -->
        <div id="results-screen" class="hidden w-full max-w-3xl mx-auto space-y-10 fade-in">
            
            <!-- Performance Score & Insights Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                
                <!-- Progress Bar Section -->
                <div class="bg-neutral-900/40 border border-neutral-900 rounded-2xl p-6 flex flex-col justify-center items-center text-center">
                    <span class="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-3">Readiness Score</span>
                    <div class="relative w-32 h-32 flex items-center justify-center">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                            <path class="text-neutral-800" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path id="score-circle" class="text-[#FFE500] transition-all duration-1000 ease-out" stroke-dasharray="0, 100" stroke-width="3" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div class="absolute text-3xl font-black tracking-tight" id="score-text">0%</div>
                    </div>
                </div>

                <!-- Strengths & Weaknesses Badges Section -->
                <div class="md:col-span-2 bg-neutral-900/40 border border-neutral-900 rounded-2xl p-6 space-y-4">
                    <div>
                        <span class="text-xs font-bold text-neutral-400 uppercase tracking-wider block mb-2">Key Strengths</span>
                        <div id="strengths-container" class="flex flex-wrap gap-2"></div>
                    </div>
                    <hr class="border-neutral-900">
                    <div>
                        <span class="text-xs font-bold text-neutral-400 uppercase tracking-wider block mb-2">Target Weaknesses</span>
                        <div id="weaknesses-container" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>

            <!-- Dynamic Question Deck -->
            <div class="space-y-4 w-full">
                <h3 class="text-xl font-bold tracking-tight text-neutral-300 pl-1">Your Custom Interview Questions</h3>
                <div id="questions-deck" class="space-y-4"></div>
            </div>

            <!-- Bottom Actions -->
            <div class="text-center pt-4">
                <button onclick="showScreen('input-screen')" class="border border-neutral-800 bg-neutral-900/50 hover:bg-neutral-800 text-white font-bold px-8 py-3.5 rounded-xl transition-all duration-200 text-sm">
                    Practice Again
                </button>
            </div>
        </div>

    </main>

    <!-- App JavaScript Controller Engine -->
    <script>
        // Screen Switcher
        function showScreen(screenId) {
            document.getElementById('landing-screen').classList.add('hidden');
            document.getElementById('input-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        // Toggle Expand/Collapse Cards
        function toggleCard(index) {
            const block = document.getElementById(`answer-block-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            if (block.classList.contains('hidden')) {
                block.classList.remove('hidden');
                icon.style.transform = "rotate(180deg)";
            } else {
                block.classList.add('hidden');
                icon.style.transform = "rotate(0deg)";
            }
        }

        // API Handler
        async function submitInterviewData() {
            const jobDesc = document.getElementById('job-desc-input').value.trim();
            const resume = document.getElementById('resume-input').value.trim();

            if (!jobDesc || !resume) {
                alert("Please complete both inputs.");
                return;
            }

            const btn = document.getElementById('generate-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            btn.disabled = true;
            btnText.innerText = "Analysing...";
            btnSpinner.classList.remove('hidden');

            try {
                const response = await fetch('/api/interview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jobDescription: jobDesc, resume: resume })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.details || data.error || 'Server Crash');

                // Render out everything dynamically onto Screen 3
                renderResults(data);
                showScreen('results-screen');

            } catch (error) {
                console.error("API Error:", error);
                alert("Generation error: " + error.message);
            } finally {
                btn.disabled = false;
                btnText.innerText = "Generate My Questions ⚡";
                btnSpinner.classList.add('hidden');
            }
        }

        // Build UI Elements Dynamically
        function renderResults(data) {
            // 1. Generate Score Animation (Weighted calculation out of 100 based on entries)
            const baseScore = data.strengths && data.questions ? Math.min(65 + (data.strengths.length * 7), 94) : 78;
            document.getElementById('score-circle').setAttribute('stroke-dasharray', `${baseScore}, 100`);
            document.getElementById('score-text').innerText = `${baseScore}%`;

            // 2. Render Green Strength Badges
            const strengthsContainer = document.getElementById('strengths-container');
            strengthsContainer.innerHTML = '';
            (data.strengths || ["Strong Background", "Technical Expertise"]).forEach(str => {
                strengthsContainer.innerHTML += `
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-950/60 border border-emerald-800 text-emerald-400">
                        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                        ${str}
                    </span>`;
            });

            // 3. Render Red Weakness Badges
            const weaknessesContainer = document.getElementById('weaknesses-container');
            weaknessesContainer.innerHTML = '';
            (data.weaknesses || ["Lacks System Design Detail"]).forEach(wk => {
                weaknessesContainer.innerHTML += `
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-red-950/60 border border-red-900 text-red-400">
                        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        ${wk}
                    </span>`;
            });

            // 4. Render Interactive Collapsible Question Deck
            const deck = document.getElementById('questions-deck');
            deck.innerHTML = '';
            
            data.questions.forEach((q, index) => {
                deck.innerHTML += `
                    <div class="bg-neutral-900/20 border border-neutral-900 hover:border-neutral-800 rounded-xl transition-all duration-200 shadow-md">
                        <!-- Card Heading Block (Clickable) -->
                        <div onclick="toggleCard(${index})" class="p-5 flex justify-between items-start cursor-pointer space-x-4 select-none">
                            <div class="space-y-2">
                                <span class="text-xs font-mono font-bold text-neutral-600 uppercase tracking-widest">Question 0${index + 1}</span>
                                <h4 class="text-base font-bold text-white tracking-tight leading-snug">${q.question}</h4>
                                <div class="pt-1">
                                    <span class="inline-block bg-[#FFE500]/10 border border-[#FFE500]/20 text-[#FFE500] text-[11px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wide">
                                        💡 Tip: ${q.tip || "Focus on metrics"}
                                    </span>
                                </div>
                            </div>
                            <svg id="icon-${index}" class="w-5 h-5 text-neutral-500 transition-transform duration-200 mt-1 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path>
                            </svg>
                        </div>
                        
                        <!-- Collapsible Ideal Answer Panel -->
                        <div id="answer-block-${index}" class="hidden border-t border-neutral-900/60 bg-neutral-950/40 p-5 rounded-b-xl space-y-1.5 fade-in">
                            <h5 class="text-xs font-bold text-neutral-400 tracking-wider uppercase">Ideal Coach Response Structure</h5>
                            <p class="text-sm text-neutral-300 leading-relaxed font-normal">${q.idealAnswer}</p>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
</html>
