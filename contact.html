<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Krackit AI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { ink: '#0D0F14', surface: '#161923', surface2: '#1E2230', hairline: '#2B3040', ink100: '#EDEFF4', ink400: '#9297AB', signal: '#C9A24B', signaldim: '#8C7638' },
                    fontFamily: { display: ['Fraunces', 'serif'], sans: ['"IBM Plex Sans"', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-ink text-ink400 font-sans antialiased min-h-screen flex flex-col selection:bg-signal selection:text-ink">

    <nav class="w-full border-b border-hairline bg-ink/80 backdrop-blur-md px-6 py-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex items-center">
            <a href="/" class="text-xl font-black tracking-tight flex items-center space-x-1 hover:opacity-80 transition-opacity">
                <span class="font-display font-medium text-ink100">Krackit</span><span class="text-signal">.</span>
            </a>
        </div>
    </nav>

    <main class="flex-grow w-full max-w-xl mx-auto px-6 py-12">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-display font-medium text-ink100 mb-3 tracking-tight">Contact Us</h1>
            <p class="text-ink400 text-sm md:text-base leading-relaxed">Have a question or need assistance? Fill out the form below and we'll get back to you within 48 hours.</p>
        </div>

        <div class="bg-surface2/20 border border-hairline p-6 md:p-8 rounded-2xl shadow-xl">
            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-5">
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                
                <div class="space-y-1.5">
                    <label class="text-xs font-bold tracking-wider text-ink400 uppercase">Email Address</label>
                    <input type="email" name="email" placeholder="name@domain.com" required class="w-full bg-surface border border-hairline rounded-xl px-4 py-3 text-sm text-ink100 placeholder-neutral-600 focus:outline-none focus:border-signal transition-colors">
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-xs font-bold tracking-wider text-ink400 uppercase">Subject</label>
                    <select name="subject" class="w-full bg-surface border border-hairline rounded-xl px-4 py-3 text-sm text-ink100 focus:outline-none focus:border-signal transition-colors cursor-pointer appearance-none">
                        <option>General Inquiry</option>
                        <option>Technical Support</option>
                        <option>Billing Question</option>
                        <option>Feedback</option>
                    </select>
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-xs font-bold tracking-wider text-ink400 uppercase">Message</label>
                    <textarea name="message" rows="5" placeholder="How can we help you?" required class="w-full bg-surface border border-hairline rounded-xl px-4 py-3 text-sm text-ink100 placeholder-neutral-600 focus:outline-none focus:border-signal transition-colors resize-none"></textarea>
                </div>
                
                <div class="pt-2">
                    <button type="submit" class="w-full bg-signal hover:bg-signaldim text-black font-black py-4 rounded-xl text-sm tracking-wide shadow-md transition-all cursor-pointer">
                        Send Message →
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="w-full border-t border-hairline bg-surface py-8 mt-12 text-center text-xs text-ink400">
        &copy; 2026 Krackit AI. All rights reserved.
    </footer>
</body>
</html>
