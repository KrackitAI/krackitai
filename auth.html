<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krackit - Secure Access Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen font-sans antialiased flex items-center justify-center p-4">

    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-md p-6 md:p-8 space-y-6 shadow-2xl">
        
        <div class="text-center space-y-1 select-none">
            <h2 class="text-3xl font-black tracking-tight">Krackit<span class="text-[#FFE500]">⚡</span></h2>
            <p class="text-neutral-400 text-xs">Dynamic Mock Interview Engineering Workspace</p>
        </div>

        <div class="flex gap-2 p-1 bg-neutral-950 border border-neutral-800 rounded-xl w-full">
            <button id="tab-signin-btn" type="button" onclick="switchAuthViewMode('signin')" class="flex-1 py-2 text-xs font-bold rounded-lg text-[#FFE500] bg-neutral-900 border border-neutral-800/80 transition-all">
                Sign In
            </button>
            <button id="tab-signup-btn" type="button" onclick="switchAuthViewMode('signup')" class="flex-1 py-2 text-xs font-bold rounded-lg text-neutral-400 transition-all">
                Sign Up / Register
            </button>
        </div>

        <div id="auth-error-box" class="hidden bg-rose-950/40 border border-rose-900 text-rose-400 p-4 rounded-xl text-xs">
            <span id="auth-error-msg">Error alert string placeholder.</span>
        </div>

        <div class="space-y-4">
            <div class="space-y-1.5">
                <label class="text-xs font-bold tracking-wider text-neutral-400 uppercase">Email Address</label>
                <input type="email" id="auth-email" placeholder="name@domain.com" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-neutral-200 placeholder-neutral-700 focus:outline-none focus:border-[#FFE500]">
            </div>
            <div class="space-y-1.5">
                <label class="text-xs font-bold tracking-wider text-neutral-400 uppercase">Password</label>
                <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-neutral-200 placeholder-neutral-700 focus:outline-none focus:border-[#FFE500]">
            </div>

            <div id="form-action-signin-container" class="block">
                <button type="button" onclick="executeAuthenticationAction('signin')" class="w-full bg-[#FFE500] hover:bg-[#ebd300] text-black font-black py-3.5 rounded-xl text-sm tracking-wide transition-all">
                    Sign In to Account →
                </button>
            </div>

            <div id="form-action-signup-container" class="hidden">
                <button type="button" onclick="executeAuthenticationAction('signup')" class="w-full bg-white hover:bg-neutral-200 text-black font-black py-3.5 rounded-xl text-sm tracking-wide transition-all">
                    Create New Account ⚡
                </button>
            </div>
        </div>

    </div>

    <script>
        // CONFIGURATION: Replace these placeholders with your actual Supabase Dashboard credentials
        const SUPABASE_URL = 'https://zlzprbespegemxnhwnuu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_WFsf4cQLdkjOh7Ar0MBytg_EVck_dLQ';

        // Initialize secure connectivity client channels safely
        let supabase = null;
        if (SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY') {
            supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
        }

        // VISUAL VIEW LAYER ROUTER: Handles shifting layouts without altering tracking string memories
        function switchAuthViewMode(targetMode) {
            const btnSignIn = document.getElementById('tab-signin-btn');
            const btnSignUp = document.getElementById('tab-signup-btn');
            const formSignIn = document.getElementById('form-action-signin-container');
            const formSignUp = document.getElementById('form-action-signup-container');
            const errorBox = document.getElementById('auth-error-box');

            if (errorBox) errorBox.classList.add('hidden');

            if (targetMode === 'signin') {
                // Focus styling allocations on sign-in elements view
                btnSignIn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-[#FFE500] bg-neutral-900 border border-neutral-800/80 transition-all";
                btnSignUp.className = "flex-1 py-2 text-xs font-bold rounded-lg text-neutral-400 transition-all";
                
                formSignIn.className = "block";
                formSignUp.className = "hidden";
            } else {
                // Focus styling allocations on registration parameters view
                btnSignUp.className = "flex-1 py-2 text-xs font-bold rounded-lg text-white bg-neutral-900 border border-neutral-800/80 transition-all";
                btnSignIn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-neutral-400 transition-all";
                
                formSignUp.className = "block";
                formSignIn.className = "hidden";
            }
        }

        // DATABASE PAYLOAD DISPATCHER PIPELINE CHANNEL
        async function executeAuthenticationAction(actionType) {
            if (!supabase) {
                alert("Configuration Notice: Please ensure your Supabase URL and public anon keys are safely pasted inside the single quotes.");
                return;
            }

            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorBox = document.getElementById('auth-error-box');
            const errorMsg = document.getElementById('auth-error-msg');
            
            if (errorBox) errorBox.classList.add('hidden');

            if (!email || !password) {
                if (errorMsg && errorBox) {
                    errorMsg.innerText = "Please fill out both your email address and password fields.";
                    errorBox.classList.remove('hidden');
                }
                return;
            }

            try {
                if (actionType === 'signup') {
                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    
                    alert("Registration Successful!\n\nIf email confirmations are enabled, check your inbox. Otherwise, switch to the Sign In tab and log in directly!");
                    switchAuthViewMode('signin');
                } else {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;

                    // Bounce back safely to home workspace root dashboard
                    window.location.href = '/';
                }
            } catch (err) {
                console.error("Auth routing failure context catch:", err);
                if (errorMsg && errorBox) {
                    errorMsg.innerText = err.message || "An error occurred during database transit connectivity execution paths.";
                    errorBox.classList.remove('hidden');
                }
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
